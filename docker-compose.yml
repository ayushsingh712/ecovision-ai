services:
  ecovision:
    build: .
    image: ecovision-ai:latest
    ports:
      - "8000:10000"
    environment:
      PORT: "10000"
      ECOVISION_DEVICE: cpu
      ECOVISION_ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      ECOVISION_LOG_LEVEL: info
    volumes:
      # Checkpoints and the model manifest are produced by training, not baked
      # into the image.
      - ./ml/models:/app/ml/models:ro
      - ./ml/evaluation:/app/ml/evaluation:ro
      # SQLite database and derived thumbnails must survive restarts.
      - ./data:/app/data
    restart: unless-stopped
